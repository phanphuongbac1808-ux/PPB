name: Quality & downloadable app
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: ppb-studio
          path: |
            index.html
            style.css
            core.js
            app.js
            README.md
